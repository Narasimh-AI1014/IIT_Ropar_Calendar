  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    ports: ["5433:5432"]          # 5433 on your PC avoids clashing with a local PostgreSQL
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    
    depends_on:
      db:
        condition: service_healthy
    
   
    environment:
      DB_URL: jdbc:postgresql://db:5432/calendar
      DB_USER: calendar
      DB_PASSWORD: calendar
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars
    ports: ["8080:8080"]