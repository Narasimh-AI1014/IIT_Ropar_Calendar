server:
  port: 8080

spring:
  application:
    name: calendar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/calendar}
    username: ${DB_USER:calendar}
    password: ${DB_PASSWORD:calendar}
    hikari:
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
    expiry-minutes: 120
  google:
    client-id: ${GOOGLE_CLIENT_ID:976396022398-932sfkphj4d9il65hlq22krprbhef2fu.apps.googleusercontent.com}
    allowed-domain: ${ALLOWED_DOMAIN:iitrpr.ac.in}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5175
      - http://localhost:5176

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha